<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMIEC Product Book</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-green: #00ad41; 
      --dark-green: #008a34;
      --light-green-bg: #f0fdf4;
      --dark-blue: #0f172a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f6f9fc;
      color: #1a202c;
      height: 100vh;
      overflow: hidden;
    }
    .app { display: flex; height: 100vh; background: white; }

    /* ----- Sidebar ----- */
    .sidebar {
      width: 300px;
      background: #fafcff;
      border-right: 1px solid #eaedf2;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid #eaedf2;
      background: white;
    }
    .sidebar-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--dark-blue);
      margin-bottom: 8px;
    }
    .sidebar-header input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #dce1e8;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: 0.2s;
    }
    .sidebar-header input:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(0, 173, 65, 0.1);
    }
    .country-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .country-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.15s;
      border-left: 3px solid transparent;
      gap: 12px;
    }
    .country-item:hover { background: #edf2f7; }
    .country-item.active {
      background: var(--light-green-bg);
      border-left-color: var(--primary-green);
    }
    .country-item .flag-img {
      width: 28px;
      height: 20px;
      border-radius: 3px;
      object-fit: cover;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .country-item .flag-text {
      font-size: 1.4rem;
      line-height: 1;
      width: 32px;
      text-align: center;
      flex-shrink: 0;
    }
    .country-item .name {
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e293b;
    }
    .country-item .count {
      margin-left: auto;
      font-size: 0.75rem;
      color: #64748b;
      background: #f1f4f9;
      padding: 2px 10px;
      border-radius: 20px;
    }

    /* ----- Main ----- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
    }

    /* ----- Top Navigation ----- */
    .playbook-nav {
      display: flex;
      align-items: center;
      padding: 14px 32px;
      background: #ffffff;
      border-bottom: 1px solid #eaedf2;
      flex-shrink: 0;
    }
    .playbook-nav .al-mulla-logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .playbook-nav .al-mulla-logo-wrap img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }
    .playbook-nav .divider {
      width: 1px;
      height: 30px;
      background: #e2e8f0;
    }
    .playbook-nav .nav-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #475569;
      font-family: 'Inter', sans-serif;
    }

    /* ----- Hero Banner ----- */
    .playbook-hero {
      background: var(--dark-blue);
      padding: 40px 32px;
      color: white;
      flex-shrink: 0;
    }
    .playbook-hero h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin: 0 0 8px 0;
      letter-spacing: -0.02em;
    }
    .playbook-hero p {
      font-size: 1.1rem;
      opacity: 0.8;
      margin: 0;
      font-weight: 400;
    }

    /* ----- Filter Bar ----- */
    .filter-bar {
      padding: 16px 32px;
      background: #fafcff;
      border-bottom: 1px solid #eaedf2;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      border-top: 4px solid var(--dark-green);
      flex-shrink: 0;
    }
    .filter-bar input,
    .filter-bar select {
      padding: 8px 16px;
      border: 1px solid #dce1e8;
      border-radius: 8px;
      font-size: 0.9rem;
      background: white;
      outline: none;
      transition: 0.2s;
      min-width: 140px;
      flex: 1 1 140px;
    }
    .filter-bar input:focus,
    .filter-bar select:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(0, 173, 65, 0.15);
    }
    .filter-bar select:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .filter-bar .clear-btn {
      padding: 8px 20px;
      background: var(--primary-green);
      color: white;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      box-shadow: 0 2px 4px rgba(0, 173, 65, 0.3);
    }
    .filter-bar .clear-btn:hover { 
      background: var(--dark-green); 
      box-shadow: 0 4px 8px rgba(0, 173, 65, 0.4);
    }

    /* ----- Country Specific Header ----- */
    .main-header {
      padding: 12px 32px;
      border-bottom: 1px solid #eaedf2;
      background: #fafcff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .main-header .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .main-header .brand .flag-img {
      width: 40px;
      height: 28px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid #e2e8f0;
    }
    .main-header .brand .flag-text {
      font-size: 2rem;
      line-height: 1;
    }
    .main-header .brand .country-name {
      font-size: 1.3rem;
      font-weight: 600;
      color: #0f172a;
    }
    .main-header .stats {
      font-size: 0.9rem;
      color: #475569;
      background: #f1f4f9;
      padding: 4px 16px;
      border-radius: 30px;
    }

    .main-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px 40px;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      text-align: center;
    }
    .placeholder h3 {
      font-size: 1.4rem;
      color: #64748b;
      margin-bottom: 6px;
    }
    .placeholder p {
      font-size: 1rem;
      color: #94a3b8;
    }

    /* ----- Product Accordion ----- */
    .product-group {
      margin-bottom: 24px;
      border: 1px solid #eaedf2;
      border-radius: 12px;
      overflow: hidden;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .product-group-header {
      padding: 16px 24px;
      background: #fafcff;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
      font-weight: 600;
      color: #0a2540;
      border-bottom: 1px solid transparent;
    }
    .product-group-header:hover { background: #f1f5f9; }
    .product-group-header .title {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .product-group-header .title .badge {
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--light-green-bg);
      color: var(--dark-green);
      padding: 2px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .product-group-header .title .currencies {
      font-weight: 400;
      color: #475569;
      font-size: 0.85rem;
    }
    .product-group-header .arrow {
      font-size: 1.2rem;
      transition: transform 0.25s;
    }
    .product-group-header .arrow.open { transform: rotate(180deg); }
    .product-group-body {
      padding: 0 24px 24px;
      display: none;
      background: white;
    }
    .product-group-body.open { display: block; }

    .product-row {
      margin-top: 20px;
      border: 1px solid #edf2f7;
      border-radius: 8px;
      padding: 16px 20px;
      background: #fafcff;
      border-top: 2px solid var(--primary-green);
    }
    .product-row:first-of-type { margin-top: 16px; }
    .product-row-title {
      font-weight: 600;
      color: #0a2540;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .product-row-title .currency-badge {
      background: #e6edf5;
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1e293b;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 24px;
    }
    .detail-item {
      display: flex;
      border-bottom: 1px solid #f1f5f9;
      padding: 6px 0;
      font-size: 0.85rem;
    }
    .detail-item .label {
      font-weight: 500;
      color: #64748b;
      min-width: 140px;
      flex-shrink: 0;
    }
    .detail-item .value {
      color: #1e293b;
      word-break: break-word;
    }
    .detail-item .value .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      background: #dcfce7;
      color: #166534;
    }
    .detail-item .value .badge.inactive {
      background: #fee2e2;
      color: #991b1b;
    }
    .detail-item .value .badge.api {
      background: #dbeafe;
      color: #1e40af;
    }
    .detail-item .value .badge.sftp {
      background: #fef3c7;
      color: #92400e;
    }
    .detail-item .value .badge.file {
      background: #e0e7ff;
      color: #3730a3;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .app { flex-direction: column; height: auto; overflow: auto; }
      .sidebar { width: 100%; height: auto; max-height: 300px; border-right: none; border-bottom: 1px solid #eaedf2; }
      .main { height: auto; }
      .playbook-nav, .playbook-hero, .filter-bar, .main-header { padding: 16px; }
      .playbook-hero h1 { font-size: 2rem; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-bar input, .filter-bar select { min-width: unset; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-item .label { min-width: 100px; }
    }
    @media (max-width: 480px) {
      .playbook-hero h1 { font-size: 1.5rem; }
      .playbook-nav .nav-title { font-size: 0.9rem; }
      .playbook-nav .al-mulla-logo-wrap img { height: 30px; }
      .main-header .brand .country-name { font-size: 1.1rem; }
    }

    .loading, .error { padding: 40px; text-align: center; color: #475569; }
    .error { color: #b91c1c; }
    .error code {
      background: #f1f5f9;
      padding: 4px 12px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 8px;
      word-break: break-all;
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>🌍 Countries</h2>
      <input type="text" id="countrySearch" placeholder="Search country..." />
    </div>
    <div class="country-list" id="countryList"></div>
  </div>

  <!-- Main -->
  <div class="main">
    
    <!-- 1. Al Mulla Logo + AMIEC Playbook Title -->
    <div class="playbook-nav">
      <div class="al-mulla-logo-wrap">
        <img src="https://boot-site.pages.dev/1569cf609ad640770c77.svg" alt="Al Mulla Exchange" loading="lazy" />
        <div class="divider"></div>
        <span class="nav-title">AMIEC Playbook</span>
      </div>
    </div>

    <!-- 2. Nium-style Hero Banner -->
    <div class="playbook-hero">
      <h1>AMIEC Product Book</h1>
      <p>Our guide to sending money using the AMIEC network.</p>
    </div>

    <!-- 3. Dynamic Multi-Filter Bar -->
    <div class="filter-bar">
      <input type="text" id="globalSearch" placeholder="🔍 Search all columns..." />
      <select id="filterProduct"><option value="">Product</option></select>
      <select id="filterCorrespondent"><option value="">Correspondent</option></select>
      <select id="filterCurrency"><option value="">Currency</option></select>
      <button class="clear-btn" id="clearFilters">✕ Clear</button>
    </div>

    <!-- 4. Country Header -->
    <div class="main-header">
      <div class="brand">
        <img id="headerFlagImg" class="flag-img" src="" alt="Flag" style="display:none;" />
        <span id="headerFlagText" class="flag-text">🌍</span>
        <span class="country-name" id="countryNameDisplay" style="font-weight:600; font-size:1.3rem;">Select a country</span>
      </div>
      <div class="stats" id="statsDisplay">0 products</div>
    </div>

    <!-- 5. Body -->
    <div class="main-body" id="mainBody">
      <div class="placeholder">
        <h3>Pick a country from the left</h3>
        <p>See all product details for that country.</p>
      </div>
    </div>
  </div>
</div>

<script>
  // =============================================================
  //  CONFIG (URL to your Excel file)
  // =============================================================
  // When you upload a new file to GitHub, browsers will automatically grab the newest version
  const EXCEL_URL = 'https://raw.githubusercontent.com/mohamedsaaif9924-web/AMIEC-Products/main/data.xlsx';

  const countryFlagEmoji = {
    "Afghanistan": "🇦🇫", "Albania": "🇦🇱", "Algeria": "🇩🇿", "Armenia": "🇦🇲",
    "Australia": "🇦🇺", "Azerbaijan": "🇦🇿", "Bahrain": "🇧🇭", "Bangladesh": "🇧🇩",
    "Benin": "🇧🇯", "Bhutan": "🇧🇹", "Bosnia & Herzegovina": "🇧🇦", "Botswana": "🇧🇼",
    "Burkina Faso": "🇧🇫", "Cambodia": "🇰🇭", "Cameroon": "🇨🇲", "Canada": "🇨🇦",
    "China": "🇨🇳", "Cote D'ivoire": "🇨🇮", "Czech Republic": "🇨🇿", "Denmark": "🇩🇰",
    "Egypt": "🇪🇬", "Ethiopia": "🇪🇹", "Europe": "🇪🇺", "Gambia": "🇬🇲",
    "Georgia": "🇬🇪", "Ghana": "🇬🇭", "Guinea": "🇬🇳", "Hong Kong": "🇭🇰",
    "Hungary": "🇭🇺", "India": "🇮🇳", "Indonesia": "🇮🇩", "Japan": "🇯🇵",
    "Jordan": "🇯🇴", "Kazakhstan": "🇰🇿", "Kenya": "🇰🇪", "Kyrgyzstan": "🇰🇬",
    "Lebanon": "🇱🇧", "Liechtenstein": "🇱🇮", "Madagascar": "🇲🇬", "Malawi": "🇲🇼",
    "Malaysia": "🇲🇾", "Mali": "🇲🇱", "Mongolia": "🇲🇳", "Morocco": "🇲🇦",
    "Nepal": "🇳🇵", "New Zealand": "🇳🇿", "Niger": "🇳🇪", "Nigeria": "🇳🇬",
    "Norway": "🇳🇴", "Oman": "🇴🇲", "Pakistan": "🇵🇰", "Palestine": "🇵🇸",
    "Philippines": "🇵🇭", "Poland": "🇵🇱", "Qatar": "🇶🇦", "Romania": "🇷🇴",
    "Rwanda": "🇷🇼", "Saudi Arabia": "🇸🇦", "Senegal": "🇸🇳", "Sierra Leone": "🇸🇱",
    "Singapore": "🇸🇬", "South Africa": "🇿🇦", "South Korea": "🇰🇷", "South Sudan": "🇸🇸",
    "Sri Lanka": "🇱🇰", "Sweden": "🇸🇪", "Switzerland": "🇨🇭", "Syria": "🇸🇾",
    "Tajikistan": "🇹🇯", "Tanzania": "🇹🇿", "Thailand": "🇹🇭", "Togo": "🇹🇬",
    "Tunisia": "🇹🇳", "Turkey": "🇹🇷", "Turkmenistan": "🇹🇲", "Uganda": "🇺🇬",
    "United Arab Emirates": "🇦🇪", "United Kingdom": "🇬🇧", "United States Of America": "🇺🇸",
    "Uzbekistan": "🇺🇿", "Vietnam": "🇻🇳"
  };

  function getFlagImageUrl(country) {
    const code = country.toLowerCase().replace(/ /g, '-');
    return `https://flagpedia.net/data/flags/h60/${code}.webp`;
  }
  function getFlagEmoji(country) {
    return countryFlagEmoji[country] || '🌍';
  }

  // =============================================================
  //  STATE
  // =============================================================
  let allData = [];
  let headers = [];
  let countries = [];
  let countryDataMap = {};
  let currentCountry = null;

  // These variables will automatically update based on what is found in the Excel file
  let productKey = 'Product';
  let correspondentKey = 'Correspondent';
  let currencyKey = 'Currency';

  const dom = {
    countryList: document.getElementById('countryList'),
    countrySearch: document.getElementById('countrySearch'),
    mainBody: document.getElementById('mainBody'),
    countryNameDisplay: document.getElementById('countryNameDisplay'),
    headerFlagImg: document.getElementById('headerFlagImg'),
    headerFlagText: document.getElementById('headerFlagText'),
    statsDisplay: document.getElementById('statsDisplay'),
    globalSearch: document.getElementById('globalSearch'),
    filterProduct: document.getElementById('filterProduct'),
    filterCorrespondent: document.getElementById('filterCorrespondent'),
    filterCurrency: document.getElementById('filterCurrency'),
    clearFiltersBtn: document.getElementById('clearFilters')
  };

  // =============================================================
  //  HELPERS
  // =============================================================
  const escapeHtml = (text) => {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  };
  const isActive = (value) => {
    const v = (value || '').toString().toLowerCase();
    return v.includes('yes') || v.includes('active');
  };
  const badgeHtml = (value) => {
    const active = isActive(value);
    return `<span class="badge ${active ? '' : 'inactive'}">${escapeHtml(value)}</span>`;
  };
  const interfaceBadge = (value) => {
    if (!value) return escapeHtml(value);
    const lv = value.toLowerCase();
    let cls = 'badge';
    if (lv.includes('api')) cls += ' api';
    else if (lv.includes('sftp')) cls += ' sftp';
    else if (lv.includes('file') || lv.includes('upload')) cls += ' file';
    return `<span class="${cls}">${escapeHtml(value)}</span>`;
  };

  const updateHeaderFlag = (country) => {
    const imgUrl = getFlagImageUrl(country);
    const emoji = getFlagEmoji(country);
    dom.headerFlagImg.style.display = 'block';
    dom.headerFlagImg.src = imgUrl;
    dom.headerFlagImg.alt = country + ' flag';
    dom.headerFlagImg.onerror = function() {
      dom.headerFlagImg.style.display = 'none';
      dom.headerFlagText.style.display = 'inline';
      dom.headerFlagText.textContent = emoji;
    };
    dom.headerFlagText.style.display = 'none';
    dom.headerFlagImg.onload = function() {
      dom.headerFlagImg.style.display = 'block';
      dom.headerFlagText.style.display = 'none';
    };
  };

  // =============================================================
  //  FETCH & AUTO-MAP COLUMN NAMES
  // =============================================================
  async function loadData() {
    try {
      // The ?v=${Date.now()} forces the browser to grab a fresh copy every time you refresh
      const response = await fetch(`${EXCEL_URL}?v=${Date.now()}`);
      if (!response.ok) throw new Error(`HTTP ${response.status} – ${response.statusText}`);
      const arrayBuffer = await response.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      if (!json.length) throw new Error('No data found in the Excel file.');
      
      allData = json;
      headers = Object.keys(allData[0]);

      // Automatically detect column names (supports spaces, underscores, lowercase)
      const findHeader = (possibleNames) => {
        for (let name of possibleNames) {
          const found = headers.find(h => h.toLowerCase().replace(/\s/g, '') === name.toLowerCase().replace(/\s/g, ''));
          if (found) return found;
        }
        return possibleNames[0];
      };
      
      // Even if you rename your Excel column to "Product", "Product Type", or "product", this will find it.
      productKey = findHeader(['Product', 'Product Type', 'Product_Type', 'producttype']);
      correspondentKey = findHeader(['Correspondent', 'correspondent']);
      currencyKey = findHeader(['Currency', 'currency']);

      // Group by country
      const countryMap = {};
      allData.forEach(row => {
        const country = row['Country'] || 'Unknown';
        if (!countryMap[country]) countryMap[country] = [];
        countryMap[country].push(row);
      });
      countries = Object.keys(countryMap).sort();
      countryDataMap = countryMap;
      
      renderCountryList(countries);
      if (countries.length > 0) selectCountry(countries[0]);
    } catch (err) {
      dom.mainBody.innerHTML = `
        <div class="error">
          ❌ Failed to load data<br/>
          <span style="font-size:0.9rem;">${err.message}</span><br/>
          <code>${EXCEL_URL}</code><br/><br/>
          Make sure your repository is <strong>public</strong> and the file exists.
        </div>
      `;
      console.error(err);
    }
  }

  // =============================================================
  //  RENDER SIDEBAR
  // =============================================================
  function renderCountryList(countryArray) {
    dom.countryList.innerHTML = '';
    countryArray.forEach(country => {
      const count = countryDataMap[country] ? countryDataMap[country].length : 0;
      const div = document.createElement('div');
      div.className = 'country-item';
      div.dataset.country = country;
      const flagImg = getFlagImageUrl(country);
      div.innerHTML = `
        <img class="flag-img" src="${flagImg}" alt="${country} flag" 
             onerror="this.style.display='none';this.nextElementSibling.style.display='inline';" />
        <span class="flag-text" style="display:none;">${getFlagEmoji(country)}</span>
        <span class="name">${escapeHtml(country)}</span>
        <span class="count">${count}</span>
      `;
      div.addEventListener('click', () => selectCountry(country));
      dom.countryList.appendChild(div);
    });
  }

  // =============================================================
  //  MULTI-FILTER DROPDOWN LOGIC
  // =============================================================
  function updateDropdownsForCountry(country) {
    const allRows = countryDataMap[country] || [];
    const search = dom.globalSearch.value.trim().toLowerCase();
    const currentProd = dom.filterProduct.value;
    const currentCorr = dom.filterCorrespondent.value;
    const currentCurr = dom.filterCurrency.value;

    const applySearch = (rowsToFilter) => {
      if (!search) return rowsToFilter;
      return rowsToFilter.filter(row => {
        return headers.some(h => {
          const val = (row[h] || '').toString().toLowerCase();
          return val.includes(search);
        });
      });
    };

    // Determine valid options based on CURRENT selections
    let prodRows = applySearch(allRows);
    if (currentCorr) prodRows = prodRows.filter(r => r[correspondentKey] === currentCorr);
    if (currentCurr) prodRows = prodRows.filter(r => r[currencyKey] === currentCurr);
    const products = [...new Set(prodRows.map(r => r[productKey]).filter(Boolean))].sort();

    let corrRows = applySearch(allRows);
    if (currentProd) corrRows = corrRows.filter(r => r[productKey] === currentProd);
    if (currentCurr) corrRows = corrRows.filter(r => r[currencyKey] === currentCurr);
    const correspondents = [...new Set(corrRows.map(r => r[correspondentKey]).filter(Boolean))].sort();

    let currRows = applySearch(allRows);
    if (currentProd) currRows = currRows.filter(r => r[productKey] === currentProd);
    if (currentCorr) currRows = currRows.filter(r => r[correspondentKey] === currentCorr);
    const currencies = [...new Set(currRows.map(r => r[currencyKey]).filter(Boolean))].sort();

    // Set options. Disabled removed so dropdowns are never grey.
    const setSelectOptions = (select, items, placeholder) => {
      const prevVal = select.value;
      select.innerHTML = `<option value="">${placeholder}</option>` +
        items.map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join('');
      if (items.includes(prevVal)) {
        select.value = prevVal;
      } else {
        select.value = '';
      }
    };

    setSelectOptions(dom.filterProduct, products, 'Product');
    setSelectOptions(dom.filterCorrespondent, correspondents, 'Correspondent');
    setSelectOptions(dom.filterCurrency, currencies, 'Currency');
  }

  // =============================================================
  //  SELECT COUNTRY & APPLY
  // =============================================================
  function selectCountry(country) {
    currentCountry = country;
    document.querySelectorAll('.country-item').forEach(el => {
      el.classList.toggle('active', el.dataset.country === country);
    });
    dom.countryNameDisplay.textContent = country;
    updateHeaderFlag(country);
    applyFilters();
  }

  // =============================================================
  //  APPLY FILTERS & RENDER RESULTS
  // =============================================================
  function applyFilters() {
    if (!currentCountry) return;
    const rows = countryDataMap[currentCountry] || [];
    const search = dom.globalSearch.value.trim().toLowerCase();
    const product = dom.filterProduct.value;
    const correspondent = dom.filterCorrespondent.value;
    const currency = dom.filterCurrency.value;

    let filtered = rows.filter(row => {
      if (search) {
        const match = headers.some(h => {
          const val = (row[h] || '').toString().toLowerCase();
          return val.includes(search);
        });
        if (!match) return false;
      }
      if (product && row[productKey] !== product) return false;
      if (correspondent && row[correspondentKey] !== correspondent) return false;
      if (currency && row[currencyKey] !== currency) return false;
      return true;
    });

    dom.statsDisplay.textContent = `${filtered.length} product${filtered.length !== 1 ? 's' : ''}`;
    renderFilteredResults(filtered);
    updateDropdownsForCountry(currentCountry);
  }

  // =============================================================
  //  RENDER FILTERED RESULTS
  // =============================================================
  function renderFilteredResults(rows) {
    if (rows.length === 0) {
      dom.mainBody.innerHTML = `<div class="placeholder"><h3>No products match your filters</h3><p>Try adjusting the filters above.</p></div>`;
      return;
    }

    const groups = {};
    rows.forEach(row => {
      const key = row[correspondentKey] || 'Uncategorized';
      if (!groups[key]) groups[key] = [];
      groups[key].push(row);
    });

    let html = '';
    const groupNames = Object.keys(groups).sort();
    groupNames.forEach(groupName => {
      const items = groups[groupName];
      const currencies = [...new Set(items.map(r => r[currencyKey]).filter(Boolean))].join(', ');

      html += `
        <div class="product-group">
          <div class="product-group-header" onclick="toggleAccordion(this)">
            <div class="title">
              <span>${escapeHtml(groupName)}</span>
              <span class="badge">${items.length} product${items.length>1?'s':''}</span>
              ${currencies ? `<span class="currencies">${escapeHtml(currencies)}</span>` : ''}
            </div>
            <span class="arrow">▼</span>
          </div>
          <div class="product-group-body open">
      `;

      items.forEach(row => {
        let detailHtml = '<div class="detail-grid">';
        headers.forEach(h => {
          let val = row[h] !== undefined && row[h] !== null ? row[h] : '';
          let displayVal = escapeHtml(val);
          if (h.toLowerCase().includes('active') || h.toLowerCase().includes('status')) {
            displayVal = badgeHtml(val);
          } else if (h.toLowerCase().includes('interface')) {
            displayVal = interfaceBadge(val);
          }
          detailHtml += `
            <div class="detail-item">
              <span class="label">${escapeHtml(h)}</span>
              <span class="value">${displayVal}</span>
            </div>
          `;
        });
        detailHtml += '</div>';

        const rowTitle = `
          <div class="product-row-title">
            <span class="currency-badge">${escapeHtml(row[correspondentKey] || '')}</span>
            ${row[currencyKey] ? `<span class="currency-badge">${escapeHtml(row[currencyKey])}</span>` : ''}
            ${row[productKey] ? `<span class="currency-badge" style="background:#e6edf5;">${escapeHtml(row[productKey])}</span>` : ''}
          </div>
        `;

        html += `
          <div class="product-row">
            ${rowTitle}
            ${detailHtml}
          </div>
        `;
      });

      html += `
          </div>
        </div>
      `;
    });

    dom.mainBody.innerHTML = html;
  }

  // =============================================================
  //  TOGGLE ACCORDION
  // =============================================================
  function toggleAccordion(header) {
    const body = header.nextElementSibling;
    const arrow = header.querySelector('.arrow');
    if (body) {
      body.classList.toggle('open');
      if (arrow) arrow.classList.toggle('open');
    }
  }

  // =============================================================
  //  EVENT LISTENERS
  // =============================================================
  dom.countrySearch.addEventListener('input', function() {
    const query = this.value.toLowerCase().trim();
    document.querySelectorAll('.country-item').forEach(item => {
      const name = item.querySelector('.name').textContent.toLowerCase();
      item.style.display = name.includes(query) ? 'flex' : 'none';
    });
  });

  dom.globalSearch.addEventListener('input', applyFilters);
  dom.filterProduct.addEventListener('change', applyFilters);
  dom.filterCorrespondent.addEventListener('change', applyFilters);
  dom.filterCurrency.addEventListener('change', applyFilters);

  dom.clearFiltersBtn.addEventListener('click', function() {
    dom.globalSearch.value = '';
    dom.filterProduct.value = '';
    dom.filterCorrespondent.value = '';
    dom.filterCurrency.value = '';
    applyFilters();
  });

  // =============================================================
  //  INIT
  // =============================================================
  loadData();
</script>
</body>
</html>
